name: Render Kindle Screen

on:
  # Backup only: external cron-job.org dispatch is the primary half-hour trigger.
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      requested_at:
        description: Optional external trigger timestamp (ISO 8601)
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/render.yml'
      - 'tools/build_site.py'
      - 'tools/render_screen.py'
      - 'tools/layout.py'
      - 'web/setup/**'
      - 'src/**'
      - 'config.json'
      - 'data/quotes*.txt'

permissions:
  contents: read

concurrency:
  group: render-screen
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      fresh: ${{ steps.build.outputs.fresh }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read runtime input outside source branch
        uses: actions/checkout@v4
        with:
          ref: runtime-data
          path: runtime-input
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m pip install Pillow==11.3.0 tzdata
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Build image or retain last good generation
        id: build
        env:
          SHAWN_MODE: cloud
          SHAWN_QUOTAS_FILE: ${{ github.workspace }}/runtime-input/quotas.json
          DISPATCH_REQUESTED_AT: ${{ inputs.requested_at }}
        run: python tools/build_site.py --previous-url https://shenliucn-prog.github.io/daypane --output _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Report degraded generation after preserving old image
        if: needs.build.outputs.fresh != 'true'
        run: echo 'Generation failed; the previous good image remains published.' && exit 1
