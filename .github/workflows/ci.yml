name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install lupa==2.6 Pillow==11.3.0
      - run: python tools/check_lua.py KindleDash.koplugin/main.lua KindleDash.koplugin/sha256.lua
      - run: python -m unittest discover -s test -p "*_test.py"
